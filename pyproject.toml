[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-funnel-ecosystem-demo"
version = "0.1.0"
description = "Portfolio demo: lead funnel → Telegram AI bot → mini-CRM"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Богдан Щербинин", email = "blessed-bless@users.noreply.github.com" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "aiogram>=3.13.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["funnel*"]

[tool.setuptools.package-data]
funnel = ["web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
