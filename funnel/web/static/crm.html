<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funnel Lab — mini-CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="/">Funnel Lab</a>
    <nav>
      <a href="/">Воронка</a>
      <a href="/crm">CRM</a>
    </nav>
  </header>

  <main class="crm-wrap">
    <h1>Mini-CRM</h1>
    <p class="lead">Заявки из лендинга и Telegram. Статусы меняются прямо здесь.</p>
    <div id="stats" class="stats"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Источник</th>
            <th>Имя</th>
            <th>Контакт</th>
            <th>Интерес</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="/static/crm.js"></script>
</body>
</html>
